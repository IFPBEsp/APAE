services:
  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:26.3.0.120487-community
    container_name: apae-sonarqube
    ports:
      - "${SONAR_PORT:-9500}:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=true
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dcluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_logs:
