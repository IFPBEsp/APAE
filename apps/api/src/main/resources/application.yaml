spring:
  application:
    name: api

# Importa o arquivo .env como fonte de properties, permitindo executar a
# aplicacao pela IDE ou via `pnpm dev:backend` sem exportar variaveis de
# ambiente manualmente. E dele que vem tambem SPRING_PROFILES_ACTIVE=dev,
# que ativa o application-dev.yaml (log de SQL) fora de producao.
# Os dois caminhos cobrem a execucao a partir do modulo (apps/api) e da
# raiz do monorepo, e ambos sao opcionais: em container o arquivo nao
# existe e as variaveis de ambiente do SO, de maior precedencia,
# fornecem os valores.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../../.env[.properties]

  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: apae_geral

  flyway:
    enabled: true
    schemas: apae_geral
    default-schema: apae_geral
    create-schemas: true
    locations: classpath:db/migration

  mvc:
    servlet:
      path: /api

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:0}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true



app:
  token:
    secret: ${JWT_SECRET}
    issuer: apae-api
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  frontend:
    reset-password-url: ${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/apae-geral/auth/reset-password}

minio:
  access:
    key: ${MINIO_ACCESS_KEY}
    secret: ${MINIO_SECRET_KEY}
  url: ${MINIO_URL}
  public:
    url: ${MINIO_PUBLIC_URL:http://localhost:9000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${API_PORT:8090}
  servlet:
    context-path: /apae-geral

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
