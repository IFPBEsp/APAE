spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5200/apae
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true

  mvc:
    servlet:
      path: /api

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

app:
  token:
    secret: "U29tZVNlY3JldEF0TGVhc3QtMjU2Qml0cw=="
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

minio:
  access:
    key: ${MINIO_ACCESS_KEY}
    secret: ${MINIO_SECRET_KEY}
  url: ${MINIO_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8090}