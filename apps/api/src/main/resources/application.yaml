spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5200/apae
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true

  mvc:
    servlet:
      path: /api

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:0}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

app:
  token:
    secret: "U29tZVNlY3JldEF0TGVhc3QtMjU2Qml0cw=="
  frontend:
    reset-password-url: ${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

minio:
  access:
    key: "ROOTUSER"
    secret: "CHANGEME123"
  url: "http://127.0.0.1:9000"

server:
  port: 8090