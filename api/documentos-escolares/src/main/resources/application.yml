spring:
  application:
    name: documentos-escolares

  datasource:
    url: jdbc:h2:mem:documentosEscolaresDB
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin

client:
  storage:
    endpoint:
      url: http://localhost:8080/bucket