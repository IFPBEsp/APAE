spring.application.name=api-crud-pacientes

# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5200/apae
spring.datasource.username= user
spring.datasource.password= pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

issuer_uri: http://localhost:8080/realms/master
jwk_set_uri: http://localhost:8080/realms/master/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.issuer-uri=${issuer_uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${jwk_set_uri}

server.port=8090

documento.digitalizado.url: http://localhost:8092/api/documents
