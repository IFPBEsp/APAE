name: apae

services:
  db:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER:-apae-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - apae-postgres-data:/var/lib/postgresql/data
    networks:
      - apae-network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: minio_docs_apae
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - apae-minio-data:/data
    user: root
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    networks:
      - apae-network
    restart: unless-stopped

  apae-sistema-geral:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: apae-sistema-geral
    ports:
      - "3000:3000"
      - "${API_PORT}:8090"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_FRONTEND_RESET_PASSWORD_URL=${APP_FRONTEND_RESET_PASSWORD_URL}
    depends_on:
      - db
      - minio
    networks:
      - apae-network
    restart: unless-stopped

volumes:
  apae-postgres-data:
  apae-minio-data:

networks:
  apae-network:
    driver: bridge
