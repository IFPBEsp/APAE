name: apae

services:
  db:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER:-apae-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - apae-postgres-data:/var/lib/postgresql/data
    networks:
      - apae-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: minio_docs_apae
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - apae-minio-data:/data
    user: root
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    networks:
      - apae-network
    restart: unless-stopped

  apae-geral-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ifpbesp/apae-geral-backend}:${IMAGE_TAG:-dev}
    container_name: apae-geral-backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - API_PORT=8080
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MINIO_URL=http://minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_FRONTEND_RESET_PASSWORD_URL=${APP_FRONTEND_RESET_PASSWORD_URL}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - apae-network
    restart: unless-stopped

  apae-geral-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ifpbesp/apae-geral-frontend}:${IMAGE_TAG:-dev}
    container_name: apae-geral-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/apae-geral/api}
    depends_on:
      - apae-geral-backend
    networks:
      - apae-network
    restart: unless-stopped

volumes:
  apae-postgres-data:
  apae-minio-data:

networks:
  apae-network:
    driver: bridge
