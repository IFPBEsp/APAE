name: Flyway Migrations Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/api/src/main/resources/db/migration/**"
      - ".github/workflows/flyway-validate.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  flyway:
    name: Validate Flyway migrations
    uses: IFPBEsp/APAE-INFRA/.github/workflows/flyway-validate-reusable.yml@4879b200ff4e0022145190727c5266a564bbc998
    with:
      migrations-path: "apps/api/src/main/resources/db/migration"
      schemas: "apae_geral"
      postgres-version: "15"
      flyway-version: "11.7.2"
      check-upgrade-path: true
      fail-on-destructive: true
