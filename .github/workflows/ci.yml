name: CI Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  # DOC detect_changes:
  # detect_changes é reponsável por identificar em qual módulo houveram alterações no commit,
  # para que apenas os tests e o build desse módulo específico sejam rodados.
  #
  # Para adicionar um novo módulo (ex: "demo2"), siga os passos:
  #
  # 1. Crie uma nova variável na seção de outputs do job:
  #      demo3_changed: ${{ steps.set_output.outputs.demo2_changed }}
  #
  # 2. Crie uma nova flag de controle dentro do script detect_changes:
  #      DEMO2_CHANGED=false
  #
  # 3. Adicione uma verificação de alteração usando grep:
  #      if grep -q '^api/demo2/' changed_files.txt; then
  #        DEMO2_CHANGED=true
  #      fi
  #
  # 4. Exporte a flag como variável de ambiente:
  #      echo "demo2_changed=$DEMO2_CHANGED" >> $GITHUB_ENV
  #
  # 5. Adicione a nova saída no passo 'Set outputs':
  #      echo "::set-output name=demo2_changed::${{ env.demo2_changed }}"
  #
  # 6. Adicione a condição de run ao job de test e build do novo modulo
  #     if: needs.detect_changes.outputs.demo2_changed == 'true'
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      demo_changed: ${{ steps.set_output.outputs.demo_changed }}
      documentos_digitalizados_changed: ${{ steps.set_output.outputs.documentos_digitalizados_changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base branch
        run: echo "BASE_BRANCH=${{ github.event.pull_request.base.ref || 'dev' }}" >> $GITHUB_ENV

      - name: Fetch base branch
        run: git fetch origin ${{ env.BASE_BRANCH }}

      - name: Compare current code with base branch
        id: detect_changes
        run: |
          BASE=$(git merge-base HEAD origin/${{ env.BASE_BRANCH }})
          echo "Comparing with base commit: $BASE"
          git diff --name-only $BASE HEAD > changed_files.txt

          if grep -q '^api/demo/' changed_files.txt; then
            echo "demo_changed=true" >> $GITHUB_ENV
          else
            echo "demo_changed=false" >> $GITHUB_ENV
          fi

          if grep -q '^api/documentos-digitalizados/' changed_files.txt; then
            echo "documentos_digitalizados_changed=true" >> $GITHUB_ENV
          else
            echo "documentos_digitalizados_changed=false" >> $GITHUB_ENV
          fi

      - name: Set output
        id: set_output
        run: echo "::set-output name=demo_changed::${{ env.demo_changed }}"
        run: echo "::set-output name=documentos_digitalizados_changed::${{ env.documentos_digitalizados_changed }}"

  # TESTES

  api-testes:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.demo_changed == 'true'

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: demo_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Tests with JUnit
        run: ./gradlew demo:test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/demo_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin

  api-testes:
  name: Run Backend Tests
  runs-on: ubuntu-latest
  needs: detect_changes
  if: needs.detect_changes.outputs.documentos_digitalizados_changed == 'true'

  services:
    minio:
      image: minio/minio:latest
      ports:
        - 9000:9000
      env:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      options: >-
        --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5
      command: server /data --console-address ":9001"

  defaults:
    run:
      working-directory: api

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x ./gradlew

    - name: Run Tests with JUnit
      run: ./gradlew documentos-digitalizados:test
      env:
        MINIO_ENDPOINT: http://localhost:9000
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadmin


  # BUILD

  build:
    name: Build Spring Boot Project
    runs-on: ubuntu-latest
    needs:
      - api-testes
    if: needs.api-testes.result == 'success'

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: demo_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build the project
        run: ./gradlew demo:build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/demo_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin

  build:
    name: Build Spring Boot Project
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.documentos_digitalizados_changed == 'true'

    services:
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Tests with JUnit
        run: ./gradlew documentos-digitalizados:build
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin