---
name: CI Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ping:
    name: Ping Check
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ping job for dependency order."

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: ping

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Start Docker Compose
        run: docker-compose -f docker/docker-compose.yml up -d

      - name: Wait for DB to be healthy
        run: |
          until [ "$(docker inspect -f '{{ .State.Health.Status }}' demo_database)" = "healthy" ]; do
            echo "Waiting for demo_database to become healthy..."
            sleep 2
          done

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Tests with JUnit
        run: ./gradlew build:test

  build:
    name: Build Spring Boot Project
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Start Docker Compose
        run: docker-compose -f docker/docker-compose.yml up -d

      - name: Wait for DB to be healthy
        run: |
          until [ "$(docker inspect -f '{{ .State.Health.Status }}' demo_database)" = "healthy" ]; do
            echo "Waiting for demo_database to become healthy..."
            sleep 2
          done

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build the project
        run: ./gradlew demo:build
