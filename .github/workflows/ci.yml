name: CI Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      demo_changed: ${{ steps.detect_demo_changes.outputs.demo_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes in demo module
        id: detect_demo_changes
        run: |
          # Obtenha as diferenças entre o commit anterior e o commit atual
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed_files.txt

          # Verifique se há alterações no módulo demo
          if grep -q '^api/demo/' changed_files.txt; then
            echo "demo_changed=true" >> $GITHUB_ENV
          else
            echo "demo_changed=false" >> $GITHUB_ENV
          fi

      - name: Set output for demo changes
        id: set_output
        run: echo "::set-output name=demo_changed::${{ env.demo_changed }}"

  api-testes:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.demo == 'true'

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: demo_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Tests with JUnit
        run: ./gradlew demo:test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/demo_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin

  # 3. Build só roda se os testes do demo rodarem
  build:
    name: Build Spring Boot Project
    runs-on: ubuntu-latest
    needs:
      - api-testes
    if: needs.api-testes.result == 'success'

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: demo_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build the project
        run: ./gradlew demo:build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/demo_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin
