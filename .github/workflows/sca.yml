name: Dependency Vulnerability Check (SCA)

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/apae/**"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      - ".trivyignore"
      - ".github/workflows/sca.yml"

permissions:
  contents: read
  security-events: write

jobs:
  sca-api:
    name: SCA Maven (apps/api)
    uses: IFPBEsp/APAE-INFRA/.github/workflows/sca-reusable.yml@7ca56cb5426127180233eb97d07a6d07cfce0b6a
    with:
      scan-path: "apps/api"
      severity: "HIGH,CRITICAL"
      ignore-unfixed: true

  sca-frontend:
    name: SCA pnpm (raiz — pnpm-lock.yaml)
    uses: IFPBEsp/APAE-INFRA/.github/workflows/sca-reusable.yml@7ca56cb5426127180233eb97d07a6d07cfce0b6a
    with:
      scan-path: "."
      skip-dirs: "apps/api"
      severity: "HIGH,CRITICAL"
      ignore-unfixed: true
