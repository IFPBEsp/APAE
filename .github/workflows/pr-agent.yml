name: PR-Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  issue_comment:
    types:
      - created

jobs:
  pr-agent:
    uses: IFPBEsp/APAE-INFRA/.github/workflows/pr-agent-reusable.yml@009b28fb646650e5412f68472af1e77561afb54b
    with:
      extra-instructions: >
        Monorepo com backend Java 21 e Spring Boot 3.5 em apps/api.
        Frontends Next.js em apps/apae e apps/management-app.
        Priorizar bugs, validacao de entradas, tratamento de null,
        seguranca, legibilidade e aderencia aos padroes do projeto.

    secrets:
      LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
