name: Remove Stale Branches

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Apenas listar, sem remover"
        type: boolean
        default: true

jobs:
  call-stale-branches:
    uses: IFPBEsp/APAE-INFRA/.github/workflows/stale-branches-reusable.yml@dev
    with:
      protected-branches: "main,dev"
      dry-run: ${{ inputs.dry-run != false }}